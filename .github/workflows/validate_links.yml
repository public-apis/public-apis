name: "Validate links"

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * *'

env:
  FILENAME: README.md

jobs:
  validate_links:
    name: 'Check all links are working'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Validate all links from README.md
        run: |
          set -o pipefail
          python scripts/validate/links.py ${FILENAME} | tee broken_links.txt

      - name: Add results to job summary
        if: always()
        run: |
          if [ -f broken_links.txt ]; then
            echo '## Link validation results' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat broken_links.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links
          path: broken_links.txt
          if-no-files-found: ignore
          retention-days: 90
